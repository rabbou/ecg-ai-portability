# The gates, on every commit.  They call the project's own tools in .venv so the
# hook and `uv run ruff / mypy / pytest` can never disagree.
exclude: ^third_party/  # upstream code kept as published
# `pre-commit install` alone then installs the commit-msg hook as well.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy src tests scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (unit, no corpora)
        entry: .venv/bin/python -m pytest -q -m "not data"
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: commit-subject
        name: commit subject (72 characters, no framing colon)
        entry: .venv/bin/python scripts/check_commit_subject.py
        language: system
        stages: [commit-msg]
