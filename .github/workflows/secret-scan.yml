name: secret-scan

# Every commit of this repository is scanned for secrets with gitleaks, on each
# push and pull request (h_185e64a134ba, 03/11/2026). Known false positives are
# listed by fingerprint in .gitleaksignore (commit:file:rule:line, never a
# value). Files over 10 MB (data, not code) are skipped. A new hit fails the
# job: rotate the secret first, then rewrite or ignore the commit.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A default-branch run is never cancelled or replaced: its group is its commit.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history, not the tip

      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          case "$(uname -sm)" in
            "Linux x86_64") arch=linux_x64; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            "Darwin arm64") arch=darwin_arm64; sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            *) echo "::error::no gitleaks build pinned for $(uname -sm)"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${arch}.tar.gz"
          echo "$sum  $tgz" | shasum -a 256 -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --max-target-megabytes 10 --exit-code 1'
